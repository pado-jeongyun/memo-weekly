description: 메모 집사에 쌓아 둔 메모를 매주 주제별로 묶어 주간 정리로 만들어 주는 도우미. 매주 정해진 때에 지난 한 주의 메모를
  모아 비슷한 주제끼리 정리하고, 사용자가 청하면 언제든 그 자리에서 정리한다. 정리본은 사람이 열어 볼 수 있는 파일로 쌓이고 채팅으로도
  보여준다.
icon: assets/icon.svg

# 하네스가 모는 CLI. 레시피가 있어 호스트에 없으면 기판이 직접 깐다
requires:
  binaries:
    - name: claude
      manager: npm
      package: "@anthropic-ai/claude-code"

harness:
  variants:
    - name: claude-code
      source: harness/claude-code
      entry: run
      binary: claude
      llm:
        provider: anthropic
        auth:
          kind: oauth

surfaces:
  # 화면 = 주간 정리 목록과 열람. 곁에 대화창을 띄워 그 자리에서 정리를 청한다
  view:
    source: surfaces/view

agents:
  # 착지 = 대화와 안내. 정리·조회 실무는 organizer 에게 위임한다
  - name: memo-weekly
    persona: agents/memo-weekly/AGENT.md
    dispatch:
      - organizer
    greeting: 그동안 적어 두신 메모를 주제별로 묶어 드리는 도우미예요. 매주 지난 한 주의 메모가 자동으로 정리되고, "이번 주 메모
      정리해줘"처럼 말씀하시면 언제든 바로 정리해 드립니다.
  # 정리 담당 — 메모를 모아 주제별로 묶고, 정리본을 파일로 보관하고 다시 찾아온다. 실무 동사 전부는 여기
  - name: organizer
    persona: agents/organizer/AGENT.md
    scripts:
      - memos-*
      - digest-*

scripts:
  source: scripts

services:
  # 원천 메모의 거처 — 메모 집사가 쌓아 둔 폴더. 읽기만 한다
  - name: memos
    dir: "~/Relay/memo"
  # 주간 정리본의 거처 — 사람이 폴더를 직접 열어 읽을 수 있는 마크다운 한 편씩
  - name: digests
    dir: "~/Relay/memo-weekly"

triggers:
  # 매주 월요일 아침, 지난 한 주의 메모를 주제별로 정리한다
  - id: weekly-digest
    label: 매주 메모 정리
    when:
      cron: "0 9 * * 1"
      tz: "Asia/Seoul"
    then:
      agent: organizer
      prompt: "지난 한 주 동안 적어 둔 메모를 memos-collect 로 모아(값을 주지 않으면 최근 7일) 비슷한 주제끼리 묶고, 그
        정리를 digest-save 로 저장해 주세요(period_start·period_end·body·memo_count). 모은
        메모가 하나도 없으면 저장하지 말고 그대로 두세요."
