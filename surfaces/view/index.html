<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 메모 정리</title>
<link rel="stylesheet" href="/assets/chat-app.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    color: #2b2b30;
    background: #f6f5f2;
  }
  header.top {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #e6e3dd;
    background: #fffdf9;
    position: sticky; top: 0; z-index: 10;
  }
  header.top h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  header.top p { margin: 6px 0 0; color: #7a756c; font-size: 13px; }

  .gallery {
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 18px;
    align-content: start;
  }
  .count { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #9a948a; margin: 0 2px 2px; }

  .card {
    background: #fffdf9;
    border: 1px solid #e6e3dd;
    border-radius: 14px;
    padding: 18px 18px 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    min-height: 168px;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(60,50,30,.08); border-color: #ddd6cb; }
  .card:focus-visible { outline: 2px solid #c9a24a; outline-offset: 2px; }
  .card .t { font-weight: 600; font-size: 16px; line-height: 1.35; margin: 0 0 12px; }
  .card .topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; flex: 1; align-content: flex-start; }
  .card .chip {
    font-size: 12px; color: #5a554d; background: #f3f0e9; border: 1px solid #e7e2d9;
    border-radius: 8px; padding: 3px 9px; line-height: 1.5;
  }
  .card .p {
    font-size: 13px; color: #6a655d; line-height: 1.6; margin: 0; flex: 1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }
  .card .foot { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .period { font-size: 12px; color: #9a948a; }
  .card .badge {
    font-size: 11px; color: #7a6a45; background: #fbf3df; border: 1px solid #f0e2c4;
    border-radius: 999px; padding: 2px 9px; font-weight: 500; white-space: nowrap;
  }

  .empty { padding: 8px 4px; color: #8a857c; font-size: 14px; line-height: 1.7; max-width: 560px; }
  .empty strong { color: #5a554d; }
  .hint { margin-top: 14px; padding: 12px 14px; background: #fff7e8; border: 1px solid #f0e2c4; border-radius: 8px; font-size: 13px; color: #7a6a45; }

  /* 카드를 누르면 그 자리에서 전체 정리를 펼쳐 읽는다 */
  .overlay {
    position: fixed; inset: 0; background: rgba(34,30,24,.44);
    display: none; align-items: flex-start; justify-content: center;
    padding: 6vh 20px 40px; z-index: 60; overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fffdf9; border-radius: 16px; max-width: 780px; width: 100%;
    padding: 30px 34px 40px; box-shadow: 0 24px 70px rgba(0,0,0,.28); position: relative;
  }
  .modal .close {
    position: absolute; top: 16px; right: 18px; width: 32px; height: 32px; border-radius: 999px;
    border: 1px solid #e6e3dd; background: #fff; color: #7a756c; font-size: 17px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal .close:hover { background: #f3f0e9; color: #4a4640; }
  .modal h2.title { margin: 0 6px 4px 0; font-size: 23px; line-height: 1.3; padding-right: 32px; }
  .modal .meta { color: #8a857c; font-size: 13px; margin-bottom: 20px; }
  .modal .body h2 { font-size: 18px; margin: 22px 0 8px; }
  .modal .body h3 { font-size: 15px; margin: 18px 0 6px; color: #4a4640; }
  .modal .body ul { margin: 6px 0 12px; padding-left: 20px; }
  .modal .body li { margin: 3px 0; line-height: 1.55; }
  .modal .body p { line-height: 1.65; margin: 8px 0; }

  .toast { position: fixed; left: 24px; bottom: 24px; background: #2b2b30; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 70; }
  .toast.show { opacity: .96; }

  @media (max-width: 560px) {
    .gallery { padding: 16px; gap: 14px; grid-template-columns: 1fr; }
    .modal { padding: 24px 20px 32px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1><span>🗂️</span> 주간 메모 정리</h1>
  <p>메모 집사에 쌓인 메모를 매주 주제별로 묶어 둥니다. 카드를 누르면 전체 정리를 펼쳐 볼 수 있어요.</p>
</header>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="닫기">✕</button>
    <div id="reader"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 곁에 뜼는 대화창은 기판이 준다 (자동 마운트) -->
<script type="module" src="/assets/chat-app.js"></script>

<script>
const ctx = window.__RELAY_CONTEXT || { base: "" };
const base = ctx.base || "";
const $gallery = document.getElementById("gallery");
const $overlay = document.getElementById("overlay");
const $reader = document.getElementById("reader");
const $toast = document.getElementById("toast");
const $close = document.getElementById("close");
let digests = [];

async function verb(name, input = {}) {
  const res = await fetch(`${base}/script/${name}`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ input }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || (data && data.error)) throw new Error((data && data.error) || res.status);
  return data.result;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 작은 마크다운 렌더러 — 제목(#/##/###), 목록(-, *), 굵게(**), 문단.
function renderMd(md) {
  const lines = String(md == null ? "" : md).split("\n");
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  let html = "";
  let inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const li = /^\s*[-*]\s+(.*)$/.exec(line);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (/^###\s+/.test(line)) html += `<h3>${inline(line.replace(/^###\s+/, ""))}</h3>`;
    else if (/^##\s+/.test(line)) html += `<h2>${inline(line.replace(/^##\s+/, ""))}</h2>`;
    else if (/^#\s+/.test(line)) html += `<h2>${inline(line.replace(/^#\s+/, ""))}</h2>`;
    else if (line.trim() !== "") html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function fmtPeriod(d) {
  if (d.period_start && d.period_end) return `${d.period_start} ~ ${d.period_end}`;
  return d.period_end || d.period_start || "";
}

// 미리보기 글에 남은 서식 기호를 걷어낸다 (주제가 없을 때의 보조 표시).
function cleanText(s) {
  return String(s == null ? "" : s).replace(/[*`#]+/g, "").replace(/\s+/g, " ").trim();
}

function renderGallery() {
  if (!digests.length) {
    $gallery.innerHTML = `
      <div class="empty">
        <p><strong>아직 만들어진 주간 정리가 없습니다.</strong></p>
        <p>메모 집사에 메모를 적어 두시면, 매주 월요일 아침에 지난 한 주의 메모가 주제별로 자동 정리됩니다.</p>
        <div class="hint">지금 바로 보고 싶으시면 오른쪽 아래 대화창에 <strong>"이번 주 메모 정리해줘"</strong>라고 말해 보세요.</div>
      </div>`;
    return;
  }
  const cards = digests.map((d) => {
    const topics = Array.isArray(d.topics) ? d.topics : [];
    let inner;
    if (topics.length) {
      const shown = topics.slice(0, 8);
      const extra = topics.length - shown.length;
      inner = `<div class="topics">${shown.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}${extra > 0 ? `<span class="chip">+${extra}</span>` : ""}</div>`;
    } else {
      inner = `<p class="p">${esc(cleanText(d.preview))}</p>`;
    }
    return `
    <div class="card" role="button" tabindex="0" data-id="${esc(d.id)}">
      <div class="t">${esc(d.title)}</div>
      ${inner}
      <div class="foot"><span class="period">${esc(fmtPeriod(d))}</span><span class="badge">메모 ${d.memo_count || 0}개</span></div>
    </div>`;
  }).join("");
  $gallery.innerHTML = `<div class="count">정리 ${digests.length}개</div>` + cards;
  for (const el of $gallery.querySelectorAll(".card")) {
    const id = el.getAttribute("data-id");
    el.addEventListener("click", () => openDigest(id));
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDigest(id); } });
  }
}

async function openDigest(id) {
  $reader.innerHTML = `<div class="empty">여는 중…</div>`;
  $overlay.classList.add("show");
  try {
    const d = await verb("digest-read", { id });
    $reader.innerHTML = `
      <h2 class="title">${esc(d.title)}</h2>
      <div class="meta">${esc(fmtPeriod(d))} · 메모 ${d.memo_count || 0}개</div>
      <div class="body">${renderMd(d.body)}</div>`;
    scene(`주간 정리 "${d.title}" 열어 보는 중`);
  } catch (e) {
    $reader.innerHTML = `<div class="empty">정리를 여는 데 실패했어요: ${esc(e.message)}</div>`;
  }
}

function closeOverlay() {
  $overlay.classList.remove("show");
  $reader.innerHTML = "";
}
$close.addEventListener("click", closeOverlay);
$overlay.addEventListener("click", (e) => { if (e.target === $overlay) closeOverlay(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $overlay.classList.contains("show")) closeOverlay(); });

async function reload() {
  try {
    const r = await verb("digest-list", { limit: 100 });
    digests = (r && r.digests) || [];
  } catch (e) {
    digests = [];
  }
  renderGallery();
}

function scene(text) {
  window.dispatchEvent(new CustomEvent("relay:scene", { detail: { scene: text } }));
}
function toast(text) {
  $toast.textContent = text;
  $toast.classList.add("show");
  setTimeout(() => $toast.classList.remove("show"), 2600);
}

// 에이전트가 정리를 새로 만들거나 고치면 갤러리를 다시 읽는다 (조용히 바꾸지 않고 알린다)
window.addEventListener("relay:turn", (e) => {
  if (!e.detail || e.detail.phase !== "settled") return;
  const before = digests.length;
  reload().then(() => {
    if (digests.length > before) toast("주간 정리가 새로 만들어졌어요");
  });
});

reload();
</script>
</body>
</html>
